<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - Queima 2026</title>
    <link rel="stylesheet" href="../CSS/main.css">
    <link rel="stylesheet" href="../CSS/profile.css">
</head>
<body>

    <header class="header">
        <a href="./mainPage.html" class="logo">Queima 2026</a>
        <nav style="display: flex; gap: 10px;">
            <a href="./profile.html" class="btn-nav outline">Back to Profile</a>
        </nav>
    </header>

    <main class="profile-container edit-profile-wrapper">
        <article class="card">
            <h2>Edit Profile Information</h2>
            
            <form id="editProfileForm">
                <div class="form-group">
                    <label for="first_name">First Name</label>
                    <input type="text" name="first_name" id="first_name" class="form-input" required>
                </div>
                
                <div class="form-group">
                    <label for="last_name">Last Name</label>
                    <input type="text" name="last_name" id="last_name" class="form-input" required>
                </div>
                
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" name="username" id="username" class="form-input" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email" class="form-input" required>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn">Save Changes</button>
                    <button type="button" class="btn-nav outline" onclick="window.location.href='profile.html'">Cancel</button>
                </div>
            </form>
        </article>
    </main>

    <script src="../JS/editProfile.js"></script>
</body>
</html>
