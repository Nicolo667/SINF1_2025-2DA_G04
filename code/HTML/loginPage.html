<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Queima 2026</title>
    <link rel="stylesheet" href="../CSS/login.css"> <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet"> <!-- same style as the main page -->
</head>
<body>

    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h2>Welcome Back</h2>
                <p>Enter your credentials to log in</p>
            </div>

            <form id="loginForm">
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" class="form-control" required>
                    <span id="emailError" style="color: red; font-size: 0.8rem; display: block; margin-top: 5px;"></span> <!-- error message that show if the mail is not correct-->
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" required>
                </div>

                <button type="submit" class="btn login-btn">Login</button>
            </form>

            <div class="login-footer">
                <p>Don't have an account? <a href="registration.html">Register now</a></p> 
                <a href="mainPage.html" class="back-link">← Back to Home page</a>
            </div>
        </div>
    </div>

    <script src="../JS/login.js"></script>
</body>
</html>
