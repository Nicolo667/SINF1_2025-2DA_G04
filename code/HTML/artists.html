<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Queima 2026 - Artists</title>
    <link rel="stylesheet" href="../CSS/artists.css">
</head>
<body>
    <header>
        <h1>Our Artists</h1>
        <nav>
            <a href="mainPage.html" >Home</a>
        </nav>
    </header>

    <section class="spotify-lineup-container">
        <div class="spotify-info">
            <h2>Official Lineup 2026</h2>
            <p>Listen to the official sounds of Queima das Fitas Porto 2026</p>
        </div>
        
        <a href="https://open.spotify.com/playlist/28ySt8bQFE5fFIXnT6hwqT?si=opoSKoATTGaqOolz9JLWVA" target="_blank" class="spotify-custom-card">
            <div class="card-left">
                <img src="https://upload.wikimedia.org/wikipedia/commons/1/19/Spotify_logo_without_text.svg" alt="Spotify Logo">
            </div>
            <div class="card-right">
                <span class="label">PLAY ON SPOTIFY</span>
                <span class="playlist-name">Queima das Fitas - Official Playlist</span>
                <span class="action">Click to open the player</span>
            </div>
            <div class="play-button">
                <div class="triangle"></div>
            </div>
        </a>
    </section>

    <main>
        <section id="artists-container" class="card-grid">
            </section>
    </main>

    <script src="../JS/artists.js"></script>
</body>
</html>
