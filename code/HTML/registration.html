<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Queima 2026</title>
    <link rel="stylesheet" href="../CSS/login.css"> <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet"> <!-- use the same css as the login page -->
</head>
<body>

    <div class="login-container"> <div class="login-card">
            <div class="login-header">
                <h2>Create Account</h2>
                <p>Join Queima 2026</p>
            </div>

            <form id="registrationForm">
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" class="form-control" required>
                </div>

                <div class="input-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" class="form-control" required>
                </div>

                <div class="input-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" class="form-control" required>
                </div>

                <div class="input-group">
                    <label for="birthDate">Birth Date</label>
                    <input type="date" id="birthDate" class="form-control" required>
                </div>

                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" class="form-control" required>
                    <span id="emailError" style="color: red; font-size: 0.8rem; display: block; margin-top: 5px;"></span>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" required>
                </div>

                <button type="submit" class="btn login-btn">Register</button>
            </form>

            <div class="login-footer">
                <p>Already have an account?  <a href="loginPage.html">Log in here</a></p>
                <a href="mainPage.html" class="back-link">← Return to Home page</a>
            </div>
        </div>
    </div>

    <script src="../JS/registration.js"></script>
</body>
</html>
