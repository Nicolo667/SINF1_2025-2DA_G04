<!-- this is the page for the single events, with all the informations about it. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Details - Queima 2026</title>
    <link rel="stylesheet" href="../CSS/main.css"> 
    <link rel="stylesheet" href="../CSS/artists.css">
</head>
<body>
    <header>
        <a href="mainPage.html" class="logo">Queima 2026</a>
        <nav>
            <a href="mainPage.html">Home</a>
        </nav>
    </header>

    <main class="container">
        <div id="event-detail-content">
            </div>

        <div id="lineup-section" style="display: none; margin-top: 4rem;">
            <h2>Lineup</h2>
            <div id="event-artists-grid" class="card-grid"></div>
        </div>
        <br> <br>
        <div class="rating-input">
            <h4>Rate this event (click on the stars to confirm):</h4>

            <textarea id="eventComment" placeholder="Write a comment..." style="width: 100%; max-width: 400px; height: 80px; border-radius: 10px; padding: 10px; margin-bottom: 10px;"></textarea>
            <div class="stars" id="starRating">
                <span data-value="1">☆</span><span data-value="2">☆</span><span data-value="3">☆</span><span data-value="4">☆</span><span data-value="5">☆</span>
            </div>
        </div>


        <section id="reviews-section" style="margin-top: 3rem;">
            <h2>User Reviews</h2>
            <div id="reviews-container">
                <p>Loading reviews...</p>
            </div>
        </section>
        
        <div style="text-align: center; margin-top: 4rem;">
            <button class="btn" id="btn-register">Register for this Event</button>
        </div>
    </main>

    <script src="../JS/eventDetails.js"></script>
</body>
</html>
