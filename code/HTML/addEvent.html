<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>SINF1 - Create Event</title>
    <link rel="stylesheet" href="../CSS/profile.css"> <style>
        .form-container { max-width: 600px; margin: 50px auto; padding: 20px; background: white; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        .btn-confirm { background-color: #28a745; color: white; border: none; padding: 12px 20px; border-radius: 5px; cursor: pointer; width: 100%; font-size: 1.1rem; }
        .btn-confirm:hover { background-color: #218838; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>➕ Create New Event</h2>
        <form id="addEventForm">
            <div class="form-group">
                <label>Event Name</label>
                <input type="text" name="title" required>
            </div>
            <div class="form-group">
                <label>Start Date</label>
                <input type="date" name="event_date" required>
            </div>
            <div class="form-group">
                <label>Start Time</label>
                <input type="time" name="event_time" required>
            </div>
            <div class="form-group">
                <label>Location</label>
                <input type="text" name="location" required>
            </div>
            <div class="form-group">
                <label>Category</label>
                <select name="type">
                    <option value="Concert">Concert</option>
                    <option value="Workshop">Workshop</option>
                    <option value="Conference">Conference</option>
                    <option value="Party">Party</option>
                </select>
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea name="description" rows="4"></textarea>
            </div>
            <button type="submit" class="btn-confirm">Confirm and Publish</button>
        </form>
    </div>

    <script>
        document.getElementById('addEventForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());

            try {
                const response = await fetch('../PHP/saveEvent.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                if (result.success) {
                    alert("Event created successfully!");
                    window.location.href = "profile.html"; // come back to profile after creating event
                } else {
                    alert("Error: " + result.message);
                }
            } catch (err) {
                alert("Connection error");
            }
        });
    </script>
</body>
</html>
