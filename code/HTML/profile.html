<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Queima 2026</title>
    <link rel="stylesheet" href="../CSS/main.css">
    <link rel="stylesheet" href="../CSS/profile.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <header class="header">
        <a href="./mainPage.html" class="logo">Queima 2026</a>
        <nav style="display: flex; gap: 10px;">
            <a href="./mainPage.html" class="btn-nav outline">Home</a>
            <button id="logoutBtn" class="btn-logout">Logout</button>
        </nav>
    </header>

    <main class="profile-container">
        <section class="profile-header">
            <div class="profile-avatar">
                <svg viewBox="0 0 24 24" width="80" height="80" fill="var(--accent)">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
            </div>
            <h1 id="fullName">Name Surname</h1>
            <p class="profile-meta">@<span id="displayUsername">username</span> • <span id="displayEmail">email@example.com</span></p>

            <div class="profile-actions" style="margin-top: 15px;">
                <button id="editProfileBtn" class="btn-edit-profile" onclick="window.location.href='editProfile.html'">Modify Profile</button>
            </div>
        </section>

        <section id="studentView" class="my-events">
            <div class="section-header">
                <h2>My Events</h2>
                <div class="header-actions">
                    <button id="exportAgendaBtn" class="btn-nav">Export Agenda (CSV)</button>
                    <a href="./mainPage.html#events" class="btn-add-event">+ Sign up for a event</a>
                </div>
            </div>
            <div id="eventsList" class="events-grid">
                </div>
        </section>

        <section id="adminView" class="admin-controls" style="display: none;">
            <h2>Admin Management Panel</h2>
            <div class="admin-buttons-grid">
                <button class="btn-admin add">
                    <span>➕</span> Add New Event
                </button>
                <button class="btn-admin edit">
                    <span>✏️</span> Edit Events
                </button>
                <button class="btn-admin import" id="importCsvBtn">
                    <span>📥</span> Import from CSV
                </button>
                <input type="file" id="csvFileInput" accept=".csv" style="display: none;">
            </div>
        </section>
    </main>

    <script src="../JS/profile.js"></script>
</body>
</html>
